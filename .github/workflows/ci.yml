name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (unit, API, real model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install -r requirements-dev.txt

      - name: Default test suite (no model download)
        run: pytest -q

      - name: Cache MiniLM model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Real-model tests
        run: pytest -q -m model
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vendormatch-ai:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name vm -p 8080:8080 vendormatch-ai:ci
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/health && break; sleep 2; done
          curl -fs http://localhost:8080/ | grep -q "VendorMatch AI"
          PROJECT=$(curl -fs -X POST http://localhost:8080/api/demo | python3 -c "import sys, json; print(json.load(sys.stdin)['project_id'])")
          curl -fs "http://localhost:8080/api/projects/${PROJECT}/comparison" | python3 -c "import sys, json; rows = json.load(sys.stdin)['rows']; assert len(rows) == 3, rows; print([(r['vendor_name'], r['overall_score']) for r in rows])"

      - name: Container logs
        if: always()
        run: docker logs vm || true
